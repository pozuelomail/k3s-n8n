# ============================================
# VALUES PARA ENTORNO DE DESARROLLO (dev)
# ============================================

environment: dev

namespace:
  create: false
  name: n8n-dev

replicaCount: 1

image:
  tag: "1.91.3"

ingress:
  enabled: true
  className: nginx
  host: n8n-dev.qforexwin.com
  annotations:
    external-dns.alpha.kubernetes.io/hostname: n8n-dev.qforexwin.com
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  certManager:
    issuer: letsencrypt-prod

persistence:
  enabled: true
  size: 5Gi
  storageClass: local-path

resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 256Mi

n8n:
  existingAuthSecret: "n8n-dev-auth"
  executions:
    mode: regular
    timeout: 3600
    timeoutMax: 7200

env:
  N8N_DIAGNOSTICS_ENABLED: "false"

postgresql:
  enabled: true
  auth:
    existingSecret: "dev-postgresql"
    username: n8n_dev
    database: n8n_dev
  persistence:
    size: 5Gi
    storageClass: local-path
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
