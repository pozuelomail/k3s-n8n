# ============================================
# VALUES PARA ENTORNO DE PREPRODUCCIÓN (pre)
# ============================================

environment: pre

namespace:
  create: true
  name: n8n-pre

replicaCount: 1

image:
  tag: "1.91.3"

ingress:
  enabled: true
  className: nginx
  host: n8n-pre.qforexwin.com
  annotations:
    external-dns.alpha.kubernetes.io/hostname: n8n-pre.qforexwin.com
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  certManager:
    issuer: letsencrypt-prod

persistence:
  enabled: true
  size: 10Gi
  storageClass: local-path

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 512Mi

n8n:
  existingAuthSecret: "n8n-pre-auth"
  executions:
    mode: regular
    timeout: 3600
    timeoutMax: 7200

env:
  N8N_DIAGNOSTICS_ENABLED: "false"

postgresql:
  enabled: true
  auth:
    existingSecret: "pre-postgresql"
    username: n8n_pre
    database: n8n_pre
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
  primary:
    persistence:
      enabled: true
      size: 10Gi
      storageClass: local-path
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 512Mi
