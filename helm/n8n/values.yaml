environment: dev

nameOverride: ""
fullnameOverride: ""

namespace:
  create: false
  name: n8n

replicaCount: 1

image:
  repository: n8nio/n8n
  pullPolicy: IfNotPresent
  tag: ""  # Sobreescribir en values-ENV.yaml — nunca usar latest en pro

service:
  type: ClusterIP
  port: 5678

ingress:
  enabled: true
  className: nginx
  host: n8n.qforexwin.com
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    external-dns.alpha.kubernetes.io/hostname: n8n.qforexwin.com
  certManager:
    issuer: letsencrypt-prod

persistence:
  enabled: true
  size: 5Gi
  accessMode: ReadWriteOnce
  storageClass: local-path
  existingClaim: ""

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

serviceAccount:
  create: true
  name: ""
  annotations: {}

networkPolicy:
  enabled: true

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

n8n:
  existingAuthSecret: ""
  executions:
    mode: regular
    timeout: 3600
    timeoutMax: 7200

env: {}

postgresql:
  enabled: true
  auth:
    username: n8n
    database: n8n
    existingSecret: ""
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
  primary:
    persistence:
      enabled: true
      size: 5Gi
      storageClass: local-path
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
