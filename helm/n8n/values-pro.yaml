# ============================================
# VALUES PARA ENTORNO DE PRODUCCIÓN (pro)
# ============================================

environment: pro

namespace:
  create: false
  name: n8n-pro

replicaCount: 1

image:
  tag: "2.44.6"

ingress:
  enabled: true
  className: nginx
  host: n8n.qforexwin.com
  annotations:
    external-dns.alpha.kubernetes.io/hostname: n8n.qforexwin.com
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/limit-rps: "20"
  certManager:
    issuer: letsencrypt-prod

persistence:
  enabled: true
  size: 10Gi
  storageClass: local-path

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

n8n:
  existingAuthSecret: "n8n-pro-auth"
  executions:
    mode: regular
    timeout: 3600
    timeoutMax: 7200

env:
  N8N_LOG_LEVEL: warn
  N8N_METRICS: "true"
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
  N8N_UNVERIFIED_PACKAGES_ENABLED: "false"     # sin paquetes de la comunidad
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"         # los flujos no leen variables de entorno (claves en credenciales)
  N8N_RUNNERS_TASK_TIMEOUT: "300"
  N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: "268435456"   # 256 MiB (futuro valor por defecto)
  N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: "1000"
  N8N_MIGRATE_FS_STORAGE_PATH: "true"          # binaryData -> storage (n8n 3)

runners:
  external: true
  authSecret: n8n-pro-runners

postgresql:
  enabled: true
  auth:
    existingSecret: "pro-postgresql"
    username: n8n_pro
    database: n8n_pro
  persistence:
    size: 8Gi
    storageClass: local-path
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

networkPolicy:
  enabled: true
